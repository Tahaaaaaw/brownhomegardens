<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="forestBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142c1f"/>
      <stop offset="100%" stop-color="#08140e"/>
    </linearGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#f5c742"/>
      <stop offset="100%" stop-color="#a67c1e"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Container -->
  <rect width="512" height="512" rx="128" fill="url(#forestBg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#goldSheen)" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Golden House Icon Symbol -->
  <g filter="url(#goldGlow)" transform="translate(56, 64) scale(0.78)">
    <!-- Roof & Chimney -->
    <path d="M256 60 L60 236 L100 236 L100 420 L412 420 L412 236 L452 236 Z" 
          fill="none" 
          stroke="url(#goldSheen)" 
          stroke-width="32" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
    
    <!-- Chimney -->
    <path d="M360 150 L360 80 L310 80 L310 106" 
          fill="none" 
          stroke="url(#goldSheen)" 
          stroke-width="26" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- Inner Stylized "B" / Architectural Window Arch -->
    <path d="M210 240 L270 240 C290 240, 305 255, 305 275 C305 295, 290 310, 270 310 L210 310 Z M210 310 L276 310 C298 310, 316 328, 316 350 C316 372, 298 390, 276 390 L210 390 Z" 
          fill="url(#goldSheen)"/>
    <rect x="180" y="210" width="30" height="210" rx="6" fill="url(#goldSheen)"/>
    
    <!-- Botanical Leaf Accent at Peak -->
    <path d="M256 30 C275 10, 305 25, 300 55 C295 85, 265 80, 256 70 C247 80, 217 85, 212 55 C207 25, 237 10, 256 30 Z" 
          fill="url(#goldSheen)"/>
  </g>
</svg>
